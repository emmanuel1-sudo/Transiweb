<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear cuenta — Transiweb</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS principal -->
    <link rel="stylesheet" href="/vista/style/styles.css" />
  </head>

  <body>
    <!-- ENCABEZADO -->
    <header>
      <div class="wrap nav">
        <a href="/" class="brand">
          <span class="dot"></span>
          TRANSIWEB
        </a>

        <a href="/inicio" class="volver-inicio"> Volver al inicio </a>
      </div>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main>
      <section class="registro">
        <div class="registro-contenido">
          <span class="section-eyebrow"> Crear cuenta </span>

          <h1>Regístrate en Transiweb</h1>

          <p>Crea tu cuenta para acceder a las funciones de Transiweb.</p>

          <form action="/registro" method="POST">
            <div id="mensaje-registro" role="alert"></div>

            <!-- NOMBRE -->
            <div class="campo">
              <label for="nombre"> Nombre completo </label>

              <input
                type="text"
                maxlength="30"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre"
                required
              />
            </div>

            <!-- CORREO -->
            <div class="campo">
              <label for="correo"> Correo electrónico </label>

              <input
                type="email"
                maxlength="30"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                required
              />
            </div>

            <!-- IDENTIFICACIÓN -->
            <div class="campo">
              <label for="identificacion"> Identificación </label>

              <input
                type="text"
                maxlength="30"
                id="identificacion"
                name="identificacion"
                placeholder="Número de identificación"
                required
              />
            </div>

            <!-- CONTRASEÑA -->
            <div class="campo">
              <label for="password"> Contraseña </label>

              <input
                type="password"
                maxlength="30"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                required
              />
            </div>

            <!-- BOTÓN CREAR CUENTA -->
            <button
              type="submit"
              name="registrar"
              class="btn-primary boton-registro"
            >
              Crear cuenta
            </button>
          </form>
        </div>
      </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
      <div class="wrap">
        <div class="foot-bottom">
          <span> © 2026 Transiweb. Proyecto académico. </span>

          <span class="mono"> v1.0 — registro </span>
        </div>
      </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="/control/registro.js"></script>
  </body>
</html>
