<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión — Transiweb</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body class="pagina-login">

    <header>
        <div class="wrap nav">

            <a href="index.html" class="brand">
                <span class="dot"></span>
                TRANSIWEB
            </a>

            <a href="index.html" class="nav-cta">
                Volver al inicio
            </a>

        </div>
    </header>

    <main class="login">

        <section class="login-contenido">

            <span class="section-eyebrow">Acceso de usuarios</span>

            <h1>Bienvenido de nuevo</h1>

            <p class="login-descripcion">
                Inicia sesión para gestionar tus trámites en Transiweb.
            </p>

            <form action="login.php" method="POST">

                <div class="campo">
                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn-primary boton-login">
                    Iniciar sesión
                </button>

            </form>

            <p class="login-registro">
                ¿Todavía no tienes una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>

        </section>

    </main>

    <footer>
        <div class="wrap">
            <div class="foot-bottom">
                <span>© 2026 Transiweb. Proyecto académico.</span>
                <span class="mono">v1.0 — login</span>
            </div>
        </div>
    </footer>

</body>
</html>
